name: "🎤 New Talk"
description: Add a new talk to the seminar schedule
title: "[New Talk]: "
labels: ["new-talk"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the details below. Leave **Date** blank to use today's date automatically.
        For **Abstract PDF**, **Speaker Image**, and **Notes PDF**: drag and drop the file directly into this box (GitHub will upload it and insert a link) — the site will pick it up automatically. You can also just leave these blank.

  - type: input
    id: title
    attributes:
      label: Talk Title
      placeholder: "e.g. Singular Value Decomposition of a Matrix"
    validations:
      required: true

  - type: input
    id: speaker
    attributes:
      label: Speaker
      placeholder: "e.g. Krishna Kumar Gupta"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: "Date (YYYY-MM-DD) — leave blank for today"
      placeholder: "2026-08-06"
    validations:
      required: false

  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "e.g. Seminar Room 2, Math Block"
    validations:
      required: false

  - type: input
    id: topic
    attributes:
      label: Topic / Area
      placeholder: "e.g. Operator Theory"
    validations:
      required: false

  - type: textarea
    id: abstract_text
    attributes:
      label: Abstract (plain text, optional — used if there's no PDF)
      placeholder: "Short abstract text..."
    validations:
      required: false

  - type: textarea
    id: abstract_pdf
    attributes:
      label: Abstract PDF
      description: Drag and drop the PDF here, or paste a link/path.
    validations:
      required: false

  - type: textarea
    id: speaker_image
    attributes:
      label: Speaker Image (optional)
      description: Drag and drop an image here, or paste a link/path.
    validations:
      required: false

  - type: textarea
    id: notes_pdf
    attributes:
      label: Notes PDF (optional, added after the talk)
      description: Drag and drop the PDF here, or paste a link/path.
    validations:
      required: false
